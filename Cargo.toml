[package]
name = "eidolon"
version = "0.1.0"
edition = "2024"
description = "Local-first command-line archive with full-text search over your notes and documents"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
